name: OpenTan
options:
  bundleIdPrefix: com.opentan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  OpenTanEngine:
    path: Engine

targets:
  OpenTan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: OpenTanEngine
        product: OpenTanEngine
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenTan
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opentan.OpenTan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  OpenTanUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: OpenTan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opentan.OpenTanUITests
        TEST_TARGET_NAME: OpenTan
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenTan:
    build:
      targets:
        OpenTan: all
        OpenTanUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenTanUITests
